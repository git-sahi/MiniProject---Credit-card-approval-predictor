<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Approval - Prediction Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="form-body">
    <div class="form-container">
        <h1 style="text-align: center; margin-top: 0;">Prediction Form</h1>
        <form action="/predict" method="POST" class="form-grid">

            <!-- Gender -->
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Male" required> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </div>
            </div>

            <!-- Own Car -->
            <div class="form-group">
                <label>Own Car</label>
                <div class="radio-group">
                    <label><input type="radio" name="car" value="Yes" required> Yes</label>
                    <label><input type="radio" name="car" value="No"> No</label>
                </div>
            </div>

            <!-- Own House -->
            <div class="form-group">
                <label>Own House</label>
                <div class="radio-group">
                    <label><input type="radio" name="realty" value="Yes" required> Yes</label>
                    <label><input type="radio" name="realty" value="No"> No</label>
                </div>
            </div>

            <!-- Annual Income -->
            <div class="form-group">
                <label for="income">Annual Income</label>
                <input type="number" id="income" name="income" required>
            </div>

            <!-- Income Type -->
            <div class="form-group">
                <label for="income_type">Income Type</label>
                <select id="income_type" name="income_type" required>
                    <option value="">Select an option</option>
                    <option value="Working">Working</option>
                    <option value="Commercial associate">Commercial associate</option>
                    <option value="Pensioner">Pensioner</option>
                    <option value="State servant">State servant</option>
                    <option value="Student">Student</option>
                </select>
            </div>

            <!-- Education -->
            <div class="form-group">
                <label for="education">Education</label>
                <select id="education" name="education" required>
                    <option value="">Select an option</option>
                    <option value="Secondary">Secondary</option>
                    <option value="Higher">Higher</option>
                    <option value="Incomplete Higher">Incomplete Higher</option>
                    <option value="Lower Secondary">Lower Secondary</option>
                    <option value="Academic Degree">Academic Degree</option>
                </select>
            </div>

            <!-- Family Status -->
            <div class="form-group">
                <label for="family_status">Family Status</label>
                <select id="family_status" name="family_status" required>
                    <option value="">Select an option</option>
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="Civil marriage">Civil marriage</option>
                    <option value="Separated">Separated</option>
                    <option value="Widow">Widow</option>
                </select>
            </div>

            <!-- Housing Type -->
            <div class="form-group">
                <label for="housing">Housing Type</label>
                <select id="housing" name="housing" required>
                    <option value="">Select an option</option>
                    <option value="House / apartment">House / apartment</option>
                    <option value="With parents">With parents</option>
                    <option value="Municipal apartment">Municipal apartment</option>
                    <option value="Rented apartment">Rented apartment</option>
                    <option value="Office apartment">Office apartment</option>
                </select>
            </div>

            <!-- Days Since Birth -->
            <div class="form-group">
                <label for="days_birth">Days Since Birth</label>
                <input type="number" id="days_birth" name="days_birth" required>
            </div>

            <!-- Days Employed -->
            <div class="form-group">
                <label for="days_employed">Days Employed</label>
                <input type="number" id="days_employed" name="days_employed" required>
            </div>

            <!-- Family Members -->
            <div class="form-group">
                <label for="family_members">Family Members</label>
                <input type="number" id="family_members" name="family_members" required>
            </div>

            <!-- EMI Paid Off -->
            <div class="form-group">
                <label>EMI Paid Off</label>
                <div class="radio-group">
                    <label><input type="radio" name="paid_off" value="Yes" required> Yes</label>
                    <label><input type="radio" name="paid_off" value="No"> No</label>
                </div>
            </div>

            <!-- Past Dues -->
            <div class="form-group">
                <label for="past_dues">Past Dues</label>
                <input type="number" id="past_dues" name="past_dues" required>
            </div>

            <!-- Number of Loans -->
            <div class="form-group">
                <label for="loans">Number of Loans</label>
                <input type="number" id="loans" name="loans" required>
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 24px;">Predict</button>

        </form>
    </div>
</div>

</body>
</html>
